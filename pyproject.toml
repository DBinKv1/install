[project]
name = "wuji-gray"
version = "0.1.0"
description = "Wuji CLI 灰测仓库自动化：伪造高版本 Release 资产、镜像 Skills、发布与清理"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "rich>=13.7",
    "typer>=0.27.3",
]

[project.scripts]
gray = "wuji_gray.cli:run"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wuji_gray"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
